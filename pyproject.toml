[project]
name = "nlb"
version = "0.1.0"
description = "Negative Lab Basic: invert phone photos of B&W film negatives"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "pillow-heif>=0.21",
    "rawpy>=0.27.1",
]

[project.scripts]
nlb = "nlb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "tifffile>=2026.9.20",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
