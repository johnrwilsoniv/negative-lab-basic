# nlb.jrwiv.com, behind Cloudflare and NPM on eggo (which terminate TLS). The pages are static and public.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;            # /main/print-preview -> /main/print-preview/, without nginx's own host and port
    server_tokens off;
    charset utf-8;

    include /etc/nginx/mime.types;   # a types block here replaces the inherited map, so bring it along
    types {
        model/stl  stl;
        model/step step stp;
        application/manifest+json webmanifest;
    }
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml image/x-icon model/stl model/step;

    # The CSP lets in three.js (jsdelivr), the fonts, and the Web Analytics beacon Cloudflare injects into every page.
    # Pages and downloads revalidate on every visit (they keep their names across rebuilds); the meshes the pages draw
    # are named by their content hash, so they never change. add_header in a location drops the server's, hence twice.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/[a-z0-9-]+/files/mesh/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~ ^/[a-z0-9-]+/files/ {
        autoindex on;
    }
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
