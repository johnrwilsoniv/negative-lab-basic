[project]
name = "nlb"
version = "0.1.0"
description = "Negative Lab Basic: invert phone and camera photos of B&W and C-41 film negatives"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "pillow-heif>=0.21",
    "rawpy>=0.27.1",
    "tifffile>=2026.1.14",
]

[project.optional-dependencies]
camera = ["gphoto2>=2.5"]  # tethered capture in `nlb studio`; needs libgphoto2

[project.scripts]
nlb = "nlb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# the darktable styles `nlb studio` develops with (see nlb/darktable.py)
[tool.hatch.build.targets.wheel.force-include]
"sony-capture/darktable/negative-c41.dtstyle" = "nlb/darktable_styles/negative-c41.dtstyle"
"sony-capture/darktable/negative-bw.dtstyle" = "nlb/darktable_styles/negative-bw.dtstyle"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
